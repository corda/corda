plugins {
    id "corda.kotlin-1.2"
    id "application"
    id "com.gradleup.shadow"
}

description 'External verifier for Corda 4.11 (Kotlin 1.2) transactions'

application {
    mainClass.set("net.corda.verifier.Main")
}

sourceSets {
    main {
        // The verifier source is shared by all the external verifiers
        kotlin.srcDir("../verifier/src/main/kotlin")
        resources.srcDir("../verifier/src/main/resources")
    }
}

dependencies {
    implementation project(":core-1.2")
    implementation project(":serialization-1.2")
    implementation "com.github.ben-manes.caffeine:caffeine:$caffeine_version"
    implementation "org.slf4j:jul-to-slf4j:$slf4j_version"

    runtimeOnly "org.apache.logging.log4j:log4j-slf4j2-impl:$log4j_version"
}
