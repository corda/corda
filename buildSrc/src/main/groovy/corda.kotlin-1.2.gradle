import net.corda.build.legacykotlin.LegacyKotlinVersion

// We cannot use the 1.2 Kotlin plugin as it only works with a very old version of Gradle, which itself will only work on Java 8. So we need
// our own plugin which calls the 1.2 compiler directly. See LegacyKotlinVersion.
LegacyKotlinVersion.KOTLIN_1_2.apply(project)
